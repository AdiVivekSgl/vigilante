name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install pytest pyflakes
      - name: Byte-compile every module (catches syntax errors in bench-only code)
        run: python -m compileall -q dev_vigilante
      - name: Lint for undefined names and unused imports
        run: python -m pyflakes dev_vigilante
      - name: Run unit tests (no bench required)
        shell: bash
        run: |
          set +e
          python -m pytest dev_vigilante/tests -q -rfE --tb=short 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          # Surface failures as annotations so they are readable without opening the log.
          if [ "$status" -ne 0 ]; then
            grep -E "^(FAILED|ERROR|E  )" pytest.log | head -40 | while IFS= read -r line; do
              echo "::error title=pytest::${line}"
            done
          fi
          exit "$status"
