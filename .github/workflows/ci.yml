name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install pytest pyflakes
      - name: Byte-compile every module (catches syntax errors in bench-only code)
        run: python -m compileall -q dev_vigilante
      - name: Lint for undefined names and unused imports
        run: python -m pyflakes dev_vigilante
      - name: Run unit tests (no bench required)
        run: python -m pytest dev_vigilante/tests -q
