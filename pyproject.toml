[project]
name = "dev_vigilante"
authors = [
    { name = "Frontec", email = "dev@frontec.example" },
]
description = "Dev Vigilante — Developer Intelligence & Context Snapshot (DISC) for ERPNext/Frappe."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # Frappe/ERPNext are provided by the bench environment; do not pin them here.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "dev_vigilante"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
